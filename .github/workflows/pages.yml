# 将静态站点发布到 GitHub Pages（合并到 default 分支后生效）
# 仓库 Settings → Pages → Build and deployment → Source 请选择「GitHub Actions」
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 若仓库 Settings → Pages 仍选「Deploy from branch: gh-pages」，须与 main 同步，否则会一直停在旧版（如 2.8）。
  sync-gh-pages-branch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point gh-pages at main (same tree as Actions deploy)
        run: git push origin HEAD:gh-pages --force
